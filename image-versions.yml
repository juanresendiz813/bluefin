images:
  # The base image is deliberately absent. quay.io enforces the
  # `quay.expires-after: 4w` label on fedora-ostree-desktops, so any digest
  # recorded here starts returning 404 about four weeks later and would break
  # every stream. `just build` resolves it from the registry and verifies it
  # with cosign on each build instead, and refuses to build if it cannot.
  - name: common
    image: ghcr.io/projectbluefin/common
    tag: latest
    digest: sha256:fbcef9b1636bc67c2cb58327527f01c9798280229ad5a91c2f8dac0a5d3b6f3c
  - name: brew
    image: ghcr.io/ublue-os/brew
    tag: latest
    digest: sha256:d52b3f578f01623636aff534291b0bd8ff0a0244ef225bf51aecb5fa05a137af
