# dnf5's COPR plugin builds the chroot name from ID in /etc/os-release. Once
# 00-image-info.sh rewrites ID=fedora to ID=bluefin, every `copr enable` asks for
# a chroot no COPR project has, and fails the build:
#
#   Chroot not found in the given Copr project (bluefin-44-x86_64).
#   You can choose one of the available chroots explicitly:
#    fedora-44-x86_64
#    ...
#
# Pinning the distribution here keeps the plugin asking for fedora-<ver> chroots.
# The ublue base image shipped this file unpackaged - `rpm -qf` reports no owner -
# so it was invisible to any package-based search and Classic never had to carry
# it. Building on Fedora's image directly, Classic owns it.
#
# Do not delete this as cruft: without it every copr_install_isolated call fails.
#
# See:
#   https://github.com/rpm-software-management/dnf5/blob/01d4df824ff4a94ae1fc288f81923d02ba71173a/dnf5-plugins/copr_plugin/copr_config.cpp#L79-L81
#   https://github.com/rpm-software-management/dnf5/blob/01d4df824ff4a94ae1fc288f81923d02ba71173a/dnf5-plugins/copr_plugin/copr_repo.cpp#L146

[main]
distribution = fedora
