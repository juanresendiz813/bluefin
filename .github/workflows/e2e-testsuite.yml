name: E2E Testsuite
on:
  # The fork's default branch does not carry this file, so workflow_dispatch
  # cannot reach it; a push to this test branch runs the two-image set.
  push:
    branches:
      - test/lts-smoke-proof
  workflow_dispatch:
    inputs:
      image:
        description: "OCI image to test"
        required: false
        default: "ghcr.io/ublue-os/bluefin:stable"
        type: string

permissions:
  contents: read
  packages: write # testsuite pushes desktop screenshot OCI artifacts to GHCR

jobs:
  e2e:
    name: E2E smoke (${{ matrix.image }})
    # Advisory only: nothing gates on this job. test_ref pins the test content
    # to the same commit as the workflow; compose_image=false keeps these
    # lanes from publishing ghcr.io/<owner>/testsuite-e2e.
    # bluefin-lts:stable failed 10/44 smoke-a and 7/65 smoke-b scenarios for
    # extensions it does not ship (projectbluefin/bluefin-lts run
    # 36341962185); the gated scenarios should now SKIP there. Full Bluefin
    # is the control: it must skip nothing new.
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        image:
          - ghcr.io/projectbluefin/bluefin-lts:stable
          - ghcr.io/projectbluefin/bluefin:stable
    uses: juanresendiz813/testsuite/.github/workflows/e2e.yml@6fdf060990e68fcba8c02239e434e6107c946768 # fix/smoke-lts-aware-extension-gate head
    with:
      image: ${{ matrix.image }}
      suites: smoke
      test_repository: juanresendiz813/testsuite
      test_ref: 6fdf060990e68fcba8c02239e434e6107c946768
      compose_image: false
