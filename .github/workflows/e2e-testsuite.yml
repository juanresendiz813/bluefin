name: E2E Testsuite
on:
  # The fork's default branch does not carry this file, so workflow_dispatch
  # cannot reach it; a push to this test branch runs the three-image set.
  push:
    branches:
      - test/pr904-proof
  workflow_dispatch:
    inputs:
      image:
        description: "OCI image to test"
        required: false
        default: "ghcr.io/ublue-os/bluefin:stable"
        type: string

permissions:
  contents: read
  packages: write # testsuite pushes desktop screenshot OCI artifacts to GHCR

jobs:
  e2e:
    name: E2E common (${{ matrix.image }})
    # Advisory only: nothing gates on this job. test_ref pins the test content
    # to the same commit as the workflow; compose_image=false keeps the run
    # from publishing ghcr.io/<owner>/testsuite-e2e.
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        image: ${{ github.event_name == 'push' && fromJSON('["ghcr.io/ublue-os/bluefin:stable", "ghcr.io/projectbluefin/bluefin:stable", "ghcr.io/projectbluefin/bluefin-lts:stable"]') || fromJSON(format('["{0}"]', inputs.image)) }}
    uses: juanresendiz813/testsuite/.github/workflows/e2e.yml@82a2be566e8fb52c782ced26a8d60af0ac9ed31a # projectbluefin/testsuite#904 head
    with:
      image: ${{ matrix.image }}
      suites: common
      test_repository: juanresendiz813/testsuite
      test_ref: 82a2be566e8fb52c782ced26a8d60af0ac9ed31a
      compose_image: false
