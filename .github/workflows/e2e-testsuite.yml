name: E2E Testsuite
on:
  # The fork's default branch does not carry this file, so workflow_dispatch
  # cannot reach it; a push to this test branch runs the two-image set.
  push:
    branches:
      - test/wheel-proof
  workflow_dispatch:
    inputs:
      image:
        description: "OCI image to test"
        required: false
        default: "ghcr.io/ublue-os/bluefin:stable"
        type: string

permissions:
  contents: read
  packages: write # testsuite pushes desktop screenshot OCI artifacts to GHCR

jobs:
  e2e:
    name: E2E common (${{ matrix.image }})
    # Advisory only: nothing gates on this job. test_ref pins the test content
    # to the same commit as the workflow; compose_image=false keeps these
    # lanes from publishing ghcr.io/<owner>/testsuite-e2e.
    # bluefin-lts:stable carries post-common#1108 (wheel-only pkexec) and
    # failed the ublue-user-setup scenario before this fix; Classic is the
    # control (pre-#1108 common, passed before).
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        image:
          - ghcr.io/projectbluefin/bluefin-lts:stable
          - ghcr.io/ublue-os/bluefin:stable
    uses: juanresendiz813/testsuite/.github/workflows/e2e.yml@e1614540190d89c39523e64928c99dadc1f4ac04 # fix/e2e-test-user-wheel head
    with:
      image: ${{ matrix.image }}
      suites: common
      test_repository: juanresendiz813/testsuite
      test_ref: e1614540190d89c39523e64928c99dadc1f4ac04
      compose_image: false
